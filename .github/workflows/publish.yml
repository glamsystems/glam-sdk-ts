name: Publish npm package

on:
  push:
    tags:
      - "v*"
  # Dispatch at an existing release tag to recover a partial run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-glam-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish SDK
    if: >-
      github.repository == 'glamsystems/glam-sdk-ts' &&
      github.ref_type == 'tag' &&
      vars.SDK_RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Validate immutable release identity
        run: node scripts/release-sdk.mjs validate

      - name: Use npm with trusted publishing support
        # npm 12.0.0 fails to resolve sigstore when publishing provenance.
        run: npm install -g npm@11.18.0

      - name: Install locked dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish, verify, and finish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-sdk.mjs publish

      - name: Upload pack manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-pack
          path: .build/release-pack.json
          if-no-files-found: ignore
